name: CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  coding-standards:
    name: Magento Coding Standard (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: '8.1'
          tools: phpcs, composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-phpcs-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-phpcs-

      - name: Install Magento Coding Standard
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev magento/magento-coding-standard --no-interaction --prefer-dist
          VENDOR_DIR=$(composer global config vendor-dir --absolute)
          phpcs --config-set installed_paths "${VENDOR_DIR}/magento/magento-coding-standard"

      - name: Run Magento Coding Standard
        run: phpcs --standard=Magento2 --extensions=php,phtml,xml --ignore=*/vendor/*,*/dist/*,*/build/* .

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    needs: [composer-validate, coding-standards]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, soap, zip, json
          coverage: none
          tools: composer:v2

      - name: Configure Magento Repository & Auth Keys
        env:
          MAGENTO_USER: ${{ secrets.MAGENTO_MARKETPLACE_USERNAME }}
          MAGENTO_PASS: ${{ secrets.MAGENTO_MARKETPLACE_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          if [ -n "$MAGENTO_USER" ] && [ -n "$MAGENTO_PASS" ]; then
            composer config -g http-basic.repo.magento.com "$MAGENTO_USER" "$MAGENTO_PASS"
          else
            echo "::error::Magento Marketplace credentials (MAGENTO_MARKETPLACE_USERNAME, MAGENTO_MARKETPLACE_PASSWORD) are not set in GitHub Secrets."
            exit 1
          fi

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Module Unit Tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --log-junit test-results-${{ matrix.php }}.xml Test/Unit

      - name: Publish Test Report (Checks & Summary)
        uses: dorny/test-reporter@6c357194179c694acfcad2100dbf27c5b9b0d5e0 # v1.9.1
        if: success() || failure()
        with:
          name: PHPUnit (PHP ${{ matrix.php }})
          path: test-results-${{ matrix.php }}.xml
          reporter: java-junit
          fail-on-empty: false
