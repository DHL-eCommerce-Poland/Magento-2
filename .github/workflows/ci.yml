name: CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  coding-standards:
    name: Magento Coding Standard (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Magento Coding Standard
        uses: extdn/github-actions-m2/magento-coding-standard@master

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, soap, zip, json
          coverage: none
          tools: composer:v2

      - name: Configure Magento Auth Keys
        env:
          MAGENTO_USER: ${{ secrets.MAGENTO_MARKETPLACE_USERNAME }}
          MAGENTO_PASS: ${{ secrets.MAGENTO_MARKETPLACE_PASSWORD }}
        run: |
          if [ -n "$MAGENTO_USER" ] && [ -n "$MAGENTO_PASS" ]; then
            composer config -g http-basic.repo.magento.com "$MAGENTO_USER" "$MAGENTO_PASS"
          else
            echo "Magento marketplace credentials not configured in secrets; skipping auth config."
          fi

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Module Unit Tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --log-junit test-results-${{ matrix.php }}.xml Test/Unit

      - name: Publish Test Report (Checks & Summary)
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: PHPUnit (PHP ${{ matrix.php }})
          path: test-results-${{ matrix.php }}.xml
          reporter: java-junit
          fail-on-empty: false
