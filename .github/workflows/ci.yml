name: CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  security-secrets:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: docker run --rm -v "${{ github.workspace }}":/code zricethezav/gitleaks:v8.24.0 detect --source /code --verbose --redact

  coding-standards:
    name: Magento Coding Standard (PHPCS)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-phpcs-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-phpcs-

      - name: Install Magento Coding Standard
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev magento/magento-coding-standard --no-interaction --prefer-dist
          phpcs -i

      - name: Run Magento Coding Standard
        run: phpcs --standard=Magento2 --extensions=php,phtml --ignore=*/vendor/* .

  unit-tests-php81:
    name: Unit Tests (PHP 8.1)
    needs: [composer-validate, coding-standards, security-secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: '8.1'
          extensions: mbstring, intl, soap, zip, json
          coverage: pcov
          tools: composer:v2

      - name: Configure Magento Repository & Auth Keys
        env:
          MAGENTO_USER: ${{ secrets.MAGENTO_MARKETPLACE_USERNAME }}
          MAGENTO_PASS: ${{ secrets.MAGENTO_MARKETPLACE_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          if [ -n "$MAGENTO_USER" ] && [ -n "$MAGENTO_PASS" ]; then
            composer config -g http-basic.repo.magento.com "$MAGENTO_USER" "$MAGENTO_PASS"
          else
            echo "::error::Magento Marketplace credentials (MAGENTO_MARKETPLACE_USERNAME, MAGENTO_MARKETPLACE_PASSWORD) are not set in GitHub Secrets."
            exit 1
          fi
          composer config -g allow-plugins true

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.1-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-8.1-

      - name: Install Dependencies
        run: composer install --no-plugins --prefer-dist --no-progress --no-interaction

      - name: Run Module Unit Tests & Coverage
        run: |
          vendor/bin/phpunit -c phpunit.xml.dist --testdox --coverage-text=coverage.txt
          cat coverage.txt
          echo "### Code Coverage (PHP 8.1)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 15 coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

