name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Marketplace Package & GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@87d00bde2555f25eb54fedf940384e99cbdc55ef # v2.32.0
        with:
          php-version: '8.1'

      - name: Extract Version
        id: get_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building release for version: ${VERSION}"

      - name: Prepare Marketplace Package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          BUILD_DIR="dist/package"
          mkdir -p "${BUILD_DIR}"

          # Copy files excluding dev, git, caches and test files
          rsync -av --exclude='.git*' \
                    --exclude='.phpunit*' \
                    --exclude='.php-cs*' \
                    --exclude='.github' \
                    --exclude='.agents' \
                    --exclude='Test' \
                    --exclude='phpunit.xml.dist' \
                    --exclude='AGENTS.md' \
                    --exclude='dist' \
                    --exclude='vendor' \
                    ./ "${BUILD_DIR}/"

          # Inject version into composer.json (Adobe Commerce Marketplace EQP requirement)
          php -r '
            $version = "'"${VERSION}"'";
            $file = "'"${BUILD_DIR}"'/composer.json";
            $data = json_decode(file_get_contents($file), true);
            $data["version"] = $version;
            file_put_contents($file, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
          '

          # Verify composer.json inside the package
          composer validate --strict "${BUILD_DIR}/composer.json"

          # Create ZIP archive with files at archive root (Marketplace requirement)
          mkdir -p dist
          ZIP_NAME="ideo-module-dhl-${VERSION}.zip"
          (cd "${BUILD_DIR}" && zip -r "../../dist/${ZIP_NAME}" .)
          echo "Created archive: dist/${ZIP_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/ideo-module-dhl-${{ steps.get_version.outputs.VERSION }}.zip
