<!-- ko if: isPointSelected() -->
<div class="dhl-point-selector-wrapper" data-bind="attr: { 'data-method': currentMethodCode() }" style="margin: 15px 0; padding: 15px; border: 1px solid #dcdcdc; border-radius: 4px; background-color: #fcfcfc;">
    <!-- ko if: isNearestDeliveryMode() -->
        <div class="dhl-point-nearest-info" style="color: #333;">
            <p><strong><!-- ko i18n: 'DHL Service Point Pickup' --><!-- /ko --></strong></p>
            <p><!-- ko i18n: 'Delivery will automatically be made to the nearest service point based on the entered recipient address.' --><!-- /ko --></p>
        </div>
    <!-- /ko -->

    <!-- ko ifnot: isNearestDeliveryMode() -->
        <!-- ko ifnot: selectedPoint() -->
            <div class="dhl-point-prompt">
                <p style="margin-bottom: 10px; font-weight: bold; color: #d40511;">
                    <!-- ko i18n: 'Select a DHL pickup point from the map:' --><!-- /ko -->
                </p>
                <button type="button"
                        class="action primary button"
                        data-bind="click: openMapModal"
                        style="background-color: #d40511; border-color: #d40511; color: #fff;">
                    <span><!-- ko i18n: 'Select point from map' --><!-- /ko --></span>
                </button>
                <div id="dhl_point_selection_error" class="mage-error" style="display: none; color: #e02b27; font-size: 12px; margin-top: 6px; font-weight: normal;"></div>
            </div>
        <!-- /ko -->

        <!-- ko if: selectedPoint() -->
            <div class="dhl-point-selected-info" style="background: #fff; padding: 12px; border: 1px solid #e0e0e0; border-radius: 3px;">
                <p style="margin-bottom: 5px; font-weight: bold; color: #333;">
                    <!-- ko i18n: 'Selected pickup point:' --><!-- /ko -->
                </p>
                <div style="font-size: 14px; line-height: 1.4;">
                    <strong data-bind="text: selectedPoint().name"></strong><br/>
                    <span data-bind="text: selectedPoint().street"></span> <span data-bind="text: selectedPoint().streetNo || selectedPoint().houseNo"></span><br/>
                    <span data-bind="text: selectedPoint().zip"></span> <span data-bind="text: selectedPoint().city"></span><br/>
                    <small style="color: #666;">SAP ID: <span data-bind="text: selectedPoint().sap"></span></small>
                </div>

                <!-- ko if: isDePackstationSelected() -->
                <div class="dhl-postnummer-field field required" style="margin-top: 10px;">
                    <label for="dhl_postnummer_input" style="font-weight: bold; font-size: 12px; color: #333;">
                        <!-- ko i18n: 'German Customer Number (Postnummer):' --><!-- /ko --> <span style="color: #e02b27;">*</span>
                    </label>
                    <input type="text"
                           id="dhl_postnummer_input"
                           name="dhl_postnummer"
                           class="input-text required-entry"
                           data-bind="value: selectedPoint().postnummer, event: { change: updatePostnummer, keyup: updatePostnummer }"
                           placeholder="12345678"
                           style="margin-top: 4px; max-width: 250px; display: block;" />
                    <div id="dhl_postnummer_input_error" class="mage-error" style="display: none; color: #e02b27; font-size: 12px; margin-top: 4px; font-weight: normal;"></div>
                </div>
                <!-- /ko -->

                <!-- ko if: isDePointSelected() -->
                <div class="dhl-postnummer-field field" style="margin-top: 10px;">
                    <label for="dhl_postnummer_input_opt" style="font-weight: bold; font-size: 12px; color: #333;">
                        <!-- ko i18n: 'German Customer Number (Postnummer):' --><!-- /ko -->
                    </label>
                    <input type="text"
                           id="dhl_postnummer_input_opt"
                           name="dhl_postnummer"
                           class="input-text"
                           data-bind="value: selectedPoint().postnummer, event: { change: updatePostnummer, keyup: updatePostnummer }"
                           placeholder="12345678"
                           style="margin-top: 4px; max-width: 250px; display: block;" />
                    <div id="dhl_postnummer_input_opt_error" class="mage-error" style="display: none; color: #e02b27; font-size: 12px; margin-top: 4px; font-weight: normal;"></div>
                </div>
                <!-- /ko -->

                <button type="button"
                        class="action secondary button"
                        data-bind="click: openMapModal"
                        style="margin-top: 10px;">
                    <span><!-- ko i18n: 'Change point' --><!-- /ko --></span>
                </button>
            </div>
        <!-- /ko -->
    <!-- /ko -->
</div>

<!-- DHL Map Modal Container -->
<div id="dhl-map-modal" style="display: none;">
    <!-- ko if: isModalOpen() -->
        <iframe data-bind="attr: { src: getMapIframeUrl() }"
                style="width: 100%; height: 700px; border: 0;"
                title="DHL Service Points Map">
        </iframe>
    <!-- /ko -->
</div>
<!-- /ko -->
