<!--
/**
 * Custom map point button template ensuring inline/auto width in admin forms.
 */
-->
<button type="button"
        css="buttonClasses"
        click="action"
        disable="disabled"
        style="width: auto !important; max-width: fit-content !important;"
        attr="'data-index': index, 'aria-labelledby': ariLabelledby">
    <span attr="'id': buttonTextId" text="title"></span>
</button>
