<input class="admin__control-text" type="time" style="width: 15rem; max-width: 100%;" data-bind="
    hasFocus: focused,
    value: value,
    valueUpdate: ['input', 'change'],
    attr: {
        name: inputName,
        placeholder: placeholder,
        'aria-describedby': noticeId,
        disabled: disabled,
        id: uid
    }" autocomplete="off"/>
